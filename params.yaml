prepare:
  settings:
    nobs: -1
    batch_size: 100
    threads: 8
  preprocessing:
    model: da_core_news_sm
    pipeline:
    - tok2vec
    - lemmatizer
    keep_negations: true
  star:
    usestar: 1
  tdm:
    tdm_cell: binary
    ngram_n: 2
    min_df:
    - 1
    - 0.01
    - 0.01
    - 0.01
    - 0.01
train:
  settings:
    verbose: false
    max_iter: 200
    seed: 17
  corex:
    n_topics: 50
    anchors: null
    anchor_strength: null
